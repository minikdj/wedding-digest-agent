name: Wedding Digest Daily

on:
  schedule:
    # 11:00 UTC = 07:00 ET during DST. Switch to '0 12 * * *' when EST resumes (Nov 1).
    - cron: '0 11 * * *'
  workflow_dispatch:    # manual trigger for testing

permissions:
  contents: write       # for snapshot commits via Contents API

concurrency:
  group: wedding-digest
  cancel-in-progress: false   # never abort a digest mid-run

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
        run: python run_digest.py
